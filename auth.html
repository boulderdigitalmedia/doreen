<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <title>Sign in — A Note For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f2ec; --surface: #fff; --sage: #7a9e7e; --sage-light: #c8dbc9;
      --sage-pale: #e8f0e8; --ink: #2c3a2e; --ink-mid: #5a6e5c; --ink-soft: #8fa391;
      --border: #dde8dd; --shadow: rgba(80,110,85,0.10); --red: #c0392b;
    }
    html, body { min-height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100svh; padding: 32px 20px; }
    /* Wordmark sized/weighted to match index.html's .nav-brand exactly
       (same font, same three breakpoint steps — see media queries below). */
    .logo { font-family: 'Newsreader', serif; font-size: 30px; font-weight: 400; color: var(--ink); margin-bottom: 6px; text-align: center; }
    .logo-sub { font-size: 16px; color: var(--ink-soft); margin-bottom: 36px; text-align: center; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px var(--shadow); }
    .tab-row { display: flex; gap: 0; margin-bottom: 28px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 18px; font-weight: 500; cursor: pointer; background: transparent; border: none; font-family: 'DM Sans', sans-serif; color: var(--ink-soft); transition: background 0.15s, color 0.15s; }
    .tab.active { background: var(--sage-pale); color: var(--sage); }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 16px; color: var(--ink-mid); margin-bottom: 6px; }
    input[type="email"], input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 16px; color: var(--ink); background: var(--bg); outline: none; transition: border-color 0.15s; }
    input:focus { border-color: var(--sage); }
    .btn { width: 100%; padding: 14px; background: var(--sage); color: #fff; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: opacity 0.15s; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .error { color: var(--red); font-size: 16px; margin-top: 10px; display: none; }
    .success { color: var(--sage); font-size: 16px; margin-top: 10px; display: none; text-align: center; }
    .site-footer { text-align: center; font-size: 16px; color: var(--ink-soft); margin-top: 28px; line-height: 1.8; }
    .site-footer a { color: var(--ink-soft); margin: 0 4px; }
    .legal-check { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 4px; }
    .legal-check input[type="checkbox"] { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--sage); cursor: pointer; }
    .legal-check label { font-size: 16px; line-height: 1.6; color: var(--ink-mid); cursor: pointer; }
    .legal-check label a { color: var(--sage); text-decoration: underline; }
    @media (max-width: 768px) { .logo { font-size: 25px; } }
    @media (max-width: 430px) { .logo { font-size: 21px; } }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4GJZL87"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <div class="logo">A Note For You</div>
  <div class="logo-sub">Your dashboard</div>

  <div class="card">
    <div class="tab-row">
      <button class="tab active" id="tabLogin"  onclick="switchTab('login')">Sign in</button>
      <button class="tab"        id="tabSignup" onclick="switchTab('signup')">Create account</button>
    </div>

    <div id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="loginPw" placeholder="Password" /></div>
      <p class="error" id="loginError"></p>
      <button class="btn" id="loginBtn" onclick="doLogin()">Sign in</button>
    </div>

    <div id="signupForm" style="display:none">
      <p class="success" id="referralBanner" style="display:none;margin-bottom:16px;text-align:center;">🎁 You were invited by a friend — subscribe after signing up and you'll both get a free gift.</p>
      <div class="field"><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="signupPw" placeholder="At least 8 characters" /></div>
      <div class="legal-check">
        <input type="checkbox" id="signupLegalCheckbox" />
        <label for="signupLegalCheckbox">I agree to the <a href="/terms" target="_blank">Terms</a>, <a href="/privacy" target="_blank">Privacy Policy</a>, and <a href="/conduct" target="_blank">Code of Conduct</a>.</label>
      </div>
      <p class="error" id="signupError"></p>
      <p class="success" id="signupSuccess">Check your email to confirm your account, then sign in.</p>
      <button class="btn" id="signupBtn" onclick="doSignup()">Create account</button>
    </div>
  </div>

  <footer class="site-footer">
    © <span class="footerYear"></span> Boulder Digital Media LLC dba A Note For You. All rights reserved.
    <br><a href="/terms">Terms</a>·<a href="/privacy">Privacy</a>·<a href="/conduct">Code of Conduct</a>
  </footer>

<script>
  const SUPABASE_URL      = 'https://nbakhtbcjxtqclgdjrqy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iYWtodGJjanh0cWNsZ2RqcnF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTM3MjMsImV4cCI6MjA5NzU2OTcyM30.S3eUIJetWWMGZCqZ2X4nMsZeZcr5zbdbfc7LWs55yHw';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Redirect if already logged in
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/account';
  });

  // A ?ref=CODE link is almost always someone who doesn't have an
  // account yet — stash the code so account.html's boot() can apply it
  // once they're actually signed in (there's no profiles row, and no
  // Supabase session, to attach it to yet at this point), default to the
  // signup tab, and show a quick heads-up so it's clear something
  // special is happening.
  var refCode = new URLSearchParams(window.location.search).get('ref');
  if (refCode) {
    localStorage.setItem('pendingReferralCode', refCode.toUpperCase());
    switchTab('signup');
    document.getElementById('referralBanner').style.display = 'block';
  }

  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active',  tab === 'login');
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
    document.getElementById('loginForm').style.display  = tab === 'login'  ? 'block' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  }

  async function doLogin() {
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginError');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';

    const { error } = await sb.auth.signInWithPassword({
      email:    document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPw').value
    });

    if (error) {
      err.textContent = error.message; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in';
    } else {
      window.location.href = '/account';
    }
  }

  async function doSignup() {
    var btn     = document.getElementById('signupBtn');
    var errEl   = document.getElementById('signupError');
    var successEl = document.getElementById('signupSuccess');
    errEl.style.display = 'none'; successEl.style.display = 'none';

    if (!document.getElementById('signupLegalCheckbox').checked) {
      errEl.textContent = 'Please agree to the Terms, Privacy Policy, and Code of Conduct to continue.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true; btn.textContent = 'Creating account…';

    // profiles rows don't exist yet at signup time (they're only created
    // later by create-checkout.js / stripe-webhook.js), and there's no
    // client-write policy on that table anyway — so the audit trail for
    // "read and agreed" goes on the auth user's own metadata instead,
    // which signUp can set directly and which persists regardless of
    // whether they ever complete checkout.
    const { error } = await sb.auth.signUp({
      email:    document.getElementById('signupEmail').value.trim(),
      password: document.getElementById('signupPw').value,
      options: {
        data: { terms_accepted_at: new Date().toISOString() }
      }
    });

    if (error) {
      errEl.textContent = error.message; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create account';
    } else {
      successEl.style.display = 'block';
      btn.textContent = 'Email sent!';
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (document.getElementById('loginForm').style.display !== 'none') doLogin();
      else doSignup();
    }
  });

  document.querySelectorAll('.footerYear').forEach(function(el) { el.textContent = new Date().getFullYear(); });
</script>
</body>
</html>
