[build]
  publish = "."
  functions = "netlify/functions"

# ── API routes ────────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/api/subscribe"
  to     = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from   = "/api/settings"
  to     = "/.netlify/functions/settings"
  status = 200

[[redirects]]
  from   = "/api/send-now"
  to     = "/.netlify/functions/send-now"
  status = 200

[[redirects]]
  from   = "/api/send-preview"
  to     = "/.netlify/functions/send-preview"
  status = 200

[[redirects]]
  from   = "/dashboard"
  to     = "/account.html"
  status = 200

[[redirects]]
  from   = "/api/change-password"
  to     = "/.netlify/functions/change-password"
  status = 200

[[redirects]]
  from   = "/api/create-checkout"
  to     = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from   = "/api/stripe-webhook"
  to     = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from   = "/api/customer-portal"
  to     = "/.netlify/functions/customer-portal"
  status = 200

[[redirects]]
  from   = "/api/update-sms-addon"
  to     = "/.netlify/functions/update-sms-addon"
  status = 200

[[redirects]]
  from   = "/api/verify-gift-password"
  to     = "/.netlify/functions/verify-gift-password"
  status = 200

[[redirects]]
  from   = "/api/update-gift-password"
  to     = "/.netlify/functions/update-gift-password"
  status = 200

# ── Auth / dashboard clean URLs ───────────────────────────────────────────────
[[redirects]]
  from   = "/login"
  to     = "/auth.html"
  status = 200

[[redirects]]
  from   = "/signup"
  to     = "/auth.html"
  status = 200

[[redirects]]
  from   = "/account"
  to     = "/account.html"
  status = 200

[[redirects]]
  from   = "/success"
  to     = "/success.html"
  status = 200

# ── Vanity slug catch-all (MUST be last) ──────────────────────────────────────
[[redirects]]
  from   = "/:slug"
  to     = "/gift.html"
  status = 200
